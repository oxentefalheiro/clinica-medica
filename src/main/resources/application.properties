spring.application.name=clinica-api

spring.datasource.url=jdbc:h2:mem:clinica_api_db
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Segurança: em produção defina as variáveis de ambiente JWT_SECRET, ADMIN_LOGIN e ADMIN_SENHA.
# Os valores depois de ":" são apenas para desenvolvimento local.
api.security.token.secret=${JWT_SECRET:chave-dev-clinica-trocar-em-producao}
api.admin.login=${ADMIN_LOGIN:admin}
api.admin.senha=${ADMIN_SENHA:admin123}

# Datas e horas no formato ISO em parâmetros de URL (ex.: ?data=2026-12-01, /hora/08:30)
spring.mvc.format.date=iso
spring.mvc.format.time=iso
